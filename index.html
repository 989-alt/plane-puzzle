<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>도형 이동 퍼즐</title>
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/Jua-Regular.subset.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/Pretendard-ExtraBold.subset.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/screens.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
 <symbol id="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M6 3.5v17a1 1 0 0 0 1.5.86l14-8.5a1 1 0 0 0 0-1.72l-14-8.5A1 1 0 0 0 6 3.5z"/></symbol>
 <symbol id="i-undo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
 <symbol id="i-skip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 4 10 8-10 8z"/><path d="M19 5v14"/></symbol>
 <symbol id="i-help" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></symbol>
 <symbol id="i-flame" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 3.5 4.5 5.5 5.6 9.2A6.6 6.6 0 0 1 12 22a6.6 6.6 0 0 1-6.4-8.3c.5-1.9 1.8-3 2.4-4.6.4 1.6 1.1 2.7 2.3 3.3C10.1 9 10.6 5.3 12 2z"/></symbol>
 <symbol id="i-trophy" viewBox="0 0 24 24" fill="currentColor"><path d="M6 2h12v2h3v3a5 5 0 0 1-5 5h-.3A6 6 0 0 1 13 14.9V18h3v4H8v-4h3v-3.1A6 6 0 0 1 8.3 12H8a5 5 0 0 1-5-5V4h3zm0 4H5v1a3 3 0 0 0 1.2 2.4C6.1 8.9 6 8.4 6 8zm12 0v2c0 .4 0 .9-.2 1.4A3 3 0 0 0 19 7V6z"/></symbol>
 <symbol id="i-touch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></symbol>
 <symbol id="i-mouse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="7"/><path d="M12 6v4"/></symbol>
 <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></symbol>
 <symbol id="i-chev" viewBox="0 0 24 24" fill="currentColor"><path d="M8 4.2v15.6a1 1 0 0 0 1.6.8l10-7.8a1 1 0 0 0 0-1.6l-10-7.8A1 1 0 0 0 8 4.2z"/></symbol>
 <symbol id="i-bulb" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></symbol>
 <symbol id="i-sparkle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></symbol>
 <symbol id="i-star" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></symbol>
 <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></symbol>
 <symbol id="i-phone-rotate" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></symbol>
</defs></svg>

<div id="app">
 <!-- ① 시작 -->
 <section id="screen-title" class="screen on" aria-label="시작 화면">
  <div class="bg"></div>
  <div class="frame">
   <span class="chip t-chip-l"><i class="dot"></i>도형 이동 퍼즐</span>
   <span class="chip t-chip-r"><i class="dot"></i>3·4학년 · 평면도형의 이동</span>
   <h1 class="logo" style="margin:0">
    <span class="lg blue" data-t="도형 이동"><span>도형 이동</span></span>
    <span class="lg" data-t="퍼즐"><span>퍼즐</span></span>
   </h1>
   <div class="sparkle" style="left:24%;top:14%"></div><div class="sparkle" style="left:73%;top:36%;transform:scale(.7);animation-delay:-1.2s"></div>
   <div class="pill t-pill">조각을 밀고, 뒤집고, 돌려서 판을 채워요!</div>
   <button class="gold" id="startBtn" type="button"><svg><use href="#i-play"/></svg>시작</button>
   <button class="ghostbtn" id="howBtn" type="button">조작 방법 보기</button>
   <span class="chip t-best" id="bestChip"><svg><use href="#i-trophy"/></svg><span id="bestText">내 최고 기록 0점 · 마당 1단계</span></span>
   <img class="t-cubi" src="assets/img/cubi-idle.webp" alt="마스코트 큐비">
  </div>
 </section>

 <!-- ③ 게임: 16:10 무대(#stage)를 화면 가운데 두고, 배경 그림·판·조각·HUD를 모두 그 안에 둔다 -->
 <section id="screen-game" class="screen" aria-label="게임 화면">
  <div class="bg"></div>
  <div id="stage">
   <svg id="board" xmlns="http://www.w3.org/2000/svg" aria-label="퍼즐 판"></svg>
   <div class="hud" data-ui="chip">
    <span class="chip" id="stageChip"><i class="dot"></i><span id="stageText">1단계 · 완성 모양</span></span>
    <span class="chip combo" id="comboChip" hidden><svg><use href="#i-flame"/></svg><span id="comboText"></span></span>
   </div>
   <div class="yard" id="yardBadge" data-ui="yard">
    <span class="yard-ic"><svg><use href="#i-home"/></svg></span>
    <div><small id="yardNext">내 마당 · 다음 단계까지 5문제</small><b id="yardName">빈 마당</b><div class="bar"><i id="yardBar"></i></div></div>
   </div>
   <div class="mission" data-ui="mission"><span id="missionText">조각을 옮겨 판을 빈틈없이 채워요!</span></div>
   <div class="score" data-ui="score"><small>점수</small><b id="scoreText">0</b></div>
   <aside class="clue" id="clueCard" data-ui="clue" aria-label="단서 카드">
    <h3>단서 카드</h3>
    <div class="lvl" id="clueLevel"></div>
    <div class="clue-body" id="clueBody"></div>
    <button class="easy" id="easyBtn" type="button" data-tool="easy" hidden><svg><use href="#i-bulb"/></svg>쉬운 단서 보기 (점수 절반)</button>
   </aside>
   <div class="tools" data-ui="tools">
    <button class="tool" type="button" data-tool="restart" aria-label="다시 놓기"><svg><use href="#i-undo"/></svg>다시 놓기</button>
    <button class="tool" type="button" data-tool="skip" aria-label="건너뛰기"><svg><use href="#i-skip"/></svg>건너뛰기</button>
    <button class="tool" type="button" data-tool="help" aria-label="도움말"><svg><use href="#i-help"/></svg>도움말</button>
   </div>
   <div class="bubble" id="bubble" data-ui="bubble" role="status" aria-live="polite"><div class="bubble-in"><img src="assets/img/cubi-think.webp" alt=""><span id="bubbleText"></span></div></div>
   <div class="card" id="loadFail" role="alert" hidden><p>문제를 불러오지 못했어요.</p><button class="gold" type="button" data-tool="retry"><svg><use href="#i-undo"/></svg>다시 불러오기</button></div>
  </div>
 </section>

 <!-- ② 조작 안내 -->
 <section id="screen-tutorial" class="screen" aria-label="조작 안내">
  <div class="bg"></div><div class="shade"></div>
  <div class="frame">
   <div class="tut-logo"><span class="lg" data-t="이렇게 움직여요!"><span>이렇게 움직여요!</span></span></div>
   <div class="seg" role="group" aria-label="조작 기기">
    <button type="button" data-kind="touch" aria-pressed="true"><svg><use href="#i-touch"/></svg>터치</button>
    <button type="button" data-kind="mouse" aria-pressed="false"><svg><use href="#i-mouse"/></svg>마우스</button>
   </div>
   <div class="panels">
    <div class="panel"><div class="star"></div><div class="hd"><b>1.</b> 밀기</div><img src="assets/img/tut-move.webp" alt=""><p data-tip="0"></p></div>
    <div class="panel"><div class="star"></div><div class="hd"><b>2.</b> 뒤집기</div><img src="assets/img/tut-flip.webp" alt=""><p data-tip="1"></p></div>
    <div class="panel"><div class="star"></div><div class="hd"><b>3.</b> 돌리기</div><img src="assets/img/tut-turn.webp" alt=""><p data-tip="2"></p></div>
   </div>
   <label class="chip dont"><input type="checkbox" id="dontShow"><span class="box"><svg><use href="#i-check"/></svg></span>다음부터 보지 않기</label>
   <button class="gold" id="tutDone" type="button">알겠어요, 시작!</button>
  </div>
 </section>

 <!-- ④ 정답 -->
 <section id="screen-win" class="screen" aria-label="정답">
  <div class="bg"></div>
  <div class="rays"></div>
  <div id="conf"></div>
  <div class="frame">
   <div class="win-logo"><span class="lg" data-t="완성!"><span>완성!</span></span></div>
   <div class="wincard card">
    <div class="win-star" id="winStar" hidden><svg><use href="#i-star"/></svg><span id="winStarText">최소 이동 성공!</span></div>
    <div class="gain" id="winGain">+0</div>
    <div class="calc" id="winCalc"></div>
    <div class="grow" id="winGrow"></div>
    <button class="gold" id="nextBtn" type="button">다음 문제</button>
   </div>
   <img class="win-cubi" src="assets/img/cubi-cheer.webp" alt="">
  </div>
 </section>

 <div id="rotateHint" role="alert" hidden><svg><use href="#i-phone-rotate"/></svg><p>화면을 가로로 돌려 주세요</p></div>
 <div class="card sys-card" id="oldBrowser" role="alert" hidden><p>이 브라우저에서는 게임을 열 수 없어요. 최신 크롬이나 엣지로 열어 주세요.</p></div>
</div>

<script>
// 모듈을 못 쓰는 옛 브라우저 안내(일반 스크립트, 옛 문법만). 지원해도 불러온 뒤 4초 안에
// 게임 모듈이 준비(window.__ppReady)되지 않으면 같은 안내를 띄운다.
(function () {
  function show() {
    var el = document.getElementById('oldBrowser');
    if (el) { el.hidden = false; el.style.display = 'block'; }
  }
  var S = window.HTMLScriptElement;
  if (!(S && 'noModule' in S.prototype)) { show(); return; }
  window.addEventListener('load', function () {
    setTimeout(function () { if (!window.__ppReady) show(); }, 4000);
  });
})();
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
